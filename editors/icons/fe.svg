<?xml version="1.0" encoding="UTF-8"?>
<!--
  The .fe file icon, adapted from fe-original.svg for the size it is actually
  drawn at. The original is hairline strokes on a 21.64 x 19.44 canvas; at the
  16px a file tree gives it, a 0.5px stroke lands on less than half a pixel and
  the wing breaks up into flecks. Same geometry and same colour, filled rather
  than stroked, on a square canvas so nothing is squashed to fit.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 21.64 21.64" width="21.64" height="21.64">
  <g transform="translate(0 1.1)" fill="#00aeef" stroke="#00aeef" stroke-width=".5" stroke-linejoin="round">
    <polygon points=".38 5.88 3.88 5.88 5.38 7.17 10.03 5.53 6.67 5.53 2.24 .38 13.47 4.38 21.27 4.31 5.03 10.32 .38 5.88"/>
    <polygon stroke="none" points="4.95 11.53 10.31 11.53 10.31 13.12 6.72 13.12 6.72 14.69 9.98 14.69 9.98 16.09 6.76 16.09 6.76 19.19 4.95 19.19 4.95 11.53"/>
    <polygon stroke="none" points="11.43 11.53 11.43 19.19 16.88 19.19 16.88 17.78 13.12 17.78 13.12 15.97 16.46 15.97 16.46 14.69 13.2 14.69 13.2 13.04 16.88 13.04 16.88 11.53 11.43 11.53"/>
  </g>
</svg>
