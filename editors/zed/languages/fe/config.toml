name = "FE"
grammar = "fe"
path_suffixes = ["fe"]
line_comments = ["// "]
block_comment = ["/* ", " */"]
tab_size = 4
hard_tabs = false
autoclose_before = "})\""

# `_` joins a word so that FUEL_CROSSFEED_VALVE completes as one thing, and
# double-clicking a control name selects all of it.
word_characters = ["_"]

brackets = [
  { start = "{", end = "}", close = true, newline = true },
  { start = "(", end = ")", close = true, newline = false },
  { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
]
