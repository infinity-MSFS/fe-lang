id = "fe"
name = "Flight Engineer"
description = "Procedure language for the flight engineer's panel: compiler-backed diagnostics, completion, hover, navigation and formatting for .fe files."
version = "0.2.0"
schema_version = 1
authors = ["infinity-MSFS"]
repository = "https://github.com/infinity-MSFS/fe-lang"

# Snippets are served by `fe-lsp` through completion, so that they can be
# filtered by where the cursor is — `category` is not a step, and `check` is not
# metadata. Contributing them here as well would offer every one of them twice.

# Zed builds the grammar by fetching this commit and compiling
# `editors/tree-sitter-fe/src/parser.c` — which is why the generated parser is
# committed. `rev` must name a commit that exists in the repository below; see
# README.md for the two ways to point it at one, including a local checkout.
[grammars.fe]
repository = "https://github.com/infinity-MSFS/fe-lang"
rev = "7ff96ef971ee203c819d2c92c871ec4f605e4399"
path = "editors/tree-sitter-fe"

[language_servers.fe-lsp]
name = "Flight Engineer"
languages = ["FE"]
